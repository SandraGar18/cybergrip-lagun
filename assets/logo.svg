<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Lagun">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="0.6" stop-color="#FACC15"/>
      <stop offset="1" stop-color="#EAB308"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#4C3DB0" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <!-- antena -->
  <rect x="246" y="62" width="20" height="62" rx="10" fill="#A5B4FC"/>
  <circle cx="256" cy="56" r="26" fill="#F472B6" opacity="0.45" filter="url(#soft)"/>
  <circle cx="256" cy="56" r="22" fill="#F472B6"/>
  <circle cx="249" cy="49" r="7" fill="#FBCFE8"/>
  <!-- cabeza -->
  <rect x="56" y="118" width="400" height="320" rx="96" fill="url(#frame)" filter="url(#shadow)"/>
  <rect x="62" y="122" width="388" height="150" rx="90" fill="#ffffff" opacity="0.12"/>
  <!-- pantalla -->
  <rect x="100" y="162" width="312" height="232" rx="64" fill="#0B1020"/>
  <!-- ojos -->
  <ellipse cx="196" cy="256" rx="36" ry="44" fill="#FACC15" opacity="0.5" filter="url(#soft)"/>
  <ellipse cx="316" cy="256" rx="36" ry="44" fill="#FACC15" opacity="0.5" filter="url(#soft)"/>
  <ellipse cx="196" cy="256" rx="32" ry="40" fill="url(#glow)"/>
  <ellipse cx="316" cy="256" rx="32" ry="40" fill="url(#glow)"/>
  <circle cx="186" cy="242" r="9" fill="#FFFBEB" opacity="0.9"/>
  <circle cx="306" cy="242" r="9" fill="#FFFBEB" opacity="0.9"/>
  <!-- sonrisa -->
  <path d="M222 332 h68 a6 6 0 0 1 6 6 v2 a22 22 0 0 1 -22 22 h-36 a22 22 0 0 1 -22 -22 v-2 a6 6 0 0 1 6 -6 z" fill="#67E8F9"/>
